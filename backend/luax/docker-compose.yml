services:
  postgres:
    image: postgres:16-alpine
    container_name: openmun-postgres
    restart: always
    environment:
      POSTGRES_DB: openmun
      POSTGRES_USER: openmun_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside source control}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
